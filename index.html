<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#05070a">
<title>หอนาฬิกาตีสิบสาม · THE THIRTEENTH CHIME</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@200;300;400;500;600&family=Noto+Sans+Thai:wght@200;300;400;500;600&family=Charmonman:wght@400;700&family=Itim&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#e8eaee; --dim:#8d97a6; --panel:#0a0d13ee; --line:#1e2733;
    --accent:#c9a227; --warn:#d9534f; --paper:#e9e4d6;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#05070a;color:var(--ink);overflow:hidden;
    font-family:"Noto Sans Thai","Sarabun","Segoe UI",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;}
  body{user-select:none}

  /* ---------- stage ---------- */
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#05070a}
  #frame{position:relative;width:100%;max-width:calc(100vh * 16 / 9);aspect-ratio:16/9;
    max-height:100vh;background:#080b10;overflow:hidden}
  #sceneimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    filter:saturate(.82) contrast(1.06) brightness(.94);transition:opacity .45s}
  #vig{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at 50% 45%,transparent 32%,rgba(0,0,0,.55) 78%,rgba(0,0,0,.88) 100%)}
  #grain{position:absolute;inset:-50%;pointer-events:none;opacity:.055;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>");
    animation:grain 1.1s steps(4) infinite}
  @keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(-3%,2%)}
    50%{transform:translate(2%,-3%)}75%{transform:translate(-2%,-2%)}100%{transform:translate(3%,1%)}}
  #missing{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:10px;background:linear-gradient(160deg,#0b1017,#05070a 60%,#0d131b);color:#5d6a7b;text-align:center;padding:24px}
  #missing b{color:#8d97a6;font-size:clamp(15px,2.4vw,22px);letter-spacing:.02em}
  #missing span{font-size:12px;letter-spacing:.12em;text-transform:uppercase}

  /* ---------- hotspots ---------- */
  .hs{position:absolute;border-radius:12px;cursor:pointer;transition:.18s;
    border:1.5px solid transparent;background:transparent}
  .hs:after{content:"";position:absolute;left:50%;top:50%;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;
    border-radius:50%;background:#fff;opacity:.34;box-shadow:0 0 12px 3px rgba(255,255,255,.35);
    animation:pulse 2.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:.55;transform:scale(1.15)}}
  .hs.door:after{width:9px;height:9px;background:var(--accent);box-shadow:0 0 14px 4px rgba(143,214,176,.45)}
  .hs:hover,.hs.reveal{border-color:rgba(255,255,255,.5);background:rgba(255,255,255,.07);
    box-shadow:inset 0 0 32px rgba(255,255,255,.09)}
  .hs.door:hover,.hs.door.reveal{border-color:rgba(143,214,176,.65);background:rgba(143,214,176,.09)}
  .hs .tip{position:absolute;left:50%;top:-6px;transform:translate(-50%,-100%);white-space:nowrap;
    background:#000c;border:1px solid var(--line);padding:5px 11px;border-radius:8px;font-size:13px;
    opacity:0;transition:.15s;pointer-events:none;letter-spacing:.01em}
  .hs:hover .tip,.hs.reveal .tip{opacity:1}

  /* ---------- dialogue ---------- */
  #say{position:absolute;left:0;right:0;bottom:0;padding:22px clamp(16px,5vw,64px) clamp(20px,4vh,44px);
    background:linear-gradient(transparent,rgba(3,5,8,.82) 22%,rgba(3,5,8,.96));
    display:none;cursor:pointer;z-index:20}
  #saytext{max-width:820px;margin:0 auto;font-size:clamp(15px,1.65vw,19px);line-height:1.85;
    white-space:pre-wrap;text-shadow:0 2px 14px #000}
  #saymore{max-width:820px;margin:12px auto 0;font-size:11.5px;letter-spacing:.16em;color:var(--dim);
    text-transform:uppercase;animation:blink 1.7s infinite}
  @keyframes blink{0%,100%{opacity:.35}50%{opacity:.9}}

  /* ---------- hud ---------- */
  #hud{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:8px;
    padding:10px clamp(10px,2vw,20px);z-index:15;
    background:linear-gradient(rgba(3,5,8,.78),transparent)}
  #where{font-size:clamp(11px,1.3vw,13px);letter-spacing:.18em;text-transform:uppercase;color:var(--dim);
    flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .btn{background:#0c1119cc;border:1px solid var(--line);color:var(--ink);padding:7px 12px;
    border-radius:9px;font-size:12.5px;cursor:pointer;font-family:inherit;transition:.15s;white-space:nowrap}
  .btn:hover{background:#141c28;border-color:#33445a}
  .btn.badge{position:relative}
  .btn.badge i{position:absolute;top:-6px;right:-6px;background:var(--accent);color:#04150c;
    font-style:normal;font-size:10px;font-weight:700;border-radius:9px;padding:1px 5px}

  /* ---------- bag ---------- */
  #bag{position:absolute;left:0;right:0;bottom:0;display:flex;gap:7px;justify-content:center;
    padding:9px 12px calc(9px + env(safe-area-inset-bottom));z-index:14;flex-wrap:wrap;
    background:linear-gradient(transparent,rgba(3,5,8,.72))}
  .slot{background:#0b1119dd;border:1px solid var(--line);border-radius:9px;padding:6px 11px;
    font-size:12.5px;cursor:pointer;transition:.15s;color:var(--dim)}
  .slot:hover{color:var(--ink);border-color:#3a4c63}
  .slot.on{border-color:var(--accent);color:var(--accent);background:#0e1c17}

  /* ---------- modal ---------- */
  .mod{position:fixed;inset:0;z-index:76;display:none;align-items:center;justify-content:center;
    background:rgba(2,4,7,.86);backdrop-filter:blur(7px);padding:16px}
  .sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px;
    width:min(760px,100%);max-height:88vh;overflow:auto;padding:clamp(18px,3vw,30px);
    box-shadow:0 30px 80px #000c}
  .sheet h2{margin:0 0 4px;font-size:clamp(17px,2.2vw,22px);letter-spacing:.01em}
  .sheet h3{margin:22px 0 9px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
  .row{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:9px}
  .close{float:right;margin:-6px -6px 0 0}
  .paper{background:linear-gradient(#f3efe2,#e6e0cf);color:#1e1a13;border-radius:10px;
    padding:clamp(18px,3vw,30px);white-space:pre-wrap;line-height:1.95;font-size:clamp(14px,1.5vw,16px);
    box-shadow:inset 0 0 60px rgba(120,100,60,.22);font-family:"Noto Serif Thai",Georgia,serif}
  .paper b{display:block;font-size:13px;letter-spacing:.14em;text-transform:uppercase;
    color:#6b5f45;margin-bottom:14px}
  .card{border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-bottom:9px;
    background:#0b1017;cursor:pointer;transition:.15s}
  .card:hover{border-color:#3a4c63;background:#0f151f}
  .card.on{border-color:var(--accent);background:#0e1c17}
  .card.done{border-color:#2d5f45;background:#0a1712}
  .card b{display:block;margin-bottom:4px;font-size:14.5px}
  .card small{color:var(--dim);line-height:1.7;font-size:12.8px}
  .muted{color:var(--dim);font-size:13px;line-height:1.8}

  /* ---------- keypad ---------- */
  #dial{display:flex;gap:9px;justify-content:center;margin:18px 0}
  #dial span{width:clamp(42px,10vw,56px);height:clamp(56px,13vw,72px);border:1px solid var(--line);
    border-radius:11px;display:flex;align-items:center;justify-content:center;
    font-size:clamp(22px,5vw,30px);background:#080c12;font-variant-numeric:tabular-nums}
  #pad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;max-width:290px;margin:0 auto}
  #pad button{aspect-ratio:1.5;font-size:19px;background:#0c1119;border:1px solid var(--line);
    color:var(--ink);border-radius:11px;cursor:pointer;font-family:inherit}
  #pad button:active{background:#182231}

  /* ---------- ranat ---------- */
  #bars{display:flex;gap:8px;justify-content:center;align-items:flex-end;margin:22px 0;height:150px}
  #bars i{flex:1;max-width:52px;background:linear-gradient(#6b4a25,#3d2913);border:1px solid #12212e;
    border-radius:6px;cursor:pointer;transition:.12s;display:block}
  #bars i:hover{filter:brightness(1.4)}
  #bars i.hit{filter:brightness(2);transform:translateY(4px)}

  /* ---------- scare ---------- */
  #scare{position:fixed;inset:0;z-index:90;display:none;background:#000}
  #scare img{width:100%;height:100%;object-fit:cover;filter:contrast(1.5) saturate(.4) brightness(1.1)}
  .shake{animation:shk .42s cubic-bezier(.36,.07,.19,.97) both}
  @keyframes shk{10%,90%{transform:translate3d(-3px,2px,0)}20%,80%{transform:translate3d(6px,-4px,0)}
    30%,50%,70%{transform:translate3d(-11px,5px,0)}40%,60%{transform:translate3d(11px,-5px,0)}}
  #flash{position:fixed;inset:0;z-index:91;background:#fff;opacity:0;pointer-events:none}

  /* ---------- toast ---------- */
  #toast{position:absolute;left:50%;top:64px;transform:translateX(-50%);z-index:30;
    display:flex;flex-direction:column;gap:7px;align-items:center;pointer-events:none}
  .tst{background:#0c1119ee;border:1px solid var(--accent);color:var(--accent);padding:9px 17px;
    border-radius:10px;font-size:13px;animation:tin .35s;box-shadow:0 8px 30px #000a}
  @keyframes tin{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}

  /* ================= เมนูหลัก (ระบบกลาง SANDOTNIM GAMES) ================= */
  #title{position:fixed;inset:0;z-index:70;background:#05070a;overflow:hidden;display:block}
  #tBgWrap{position:absolute;inset:0;will-change:transform}
  #tBg{position:absolute;inset:0;background:center/cover no-repeat;opacity:0;transition:opacity 1.4s ease}
  #tBg.on{opacity:1}
  .tScrim{position:absolute;inset:0;pointer-events:none}
  .tScrim.a{background:rgba(0,0,0,.14)}
  .tScrim.v{background:radial-gradient(132% 100% at 62% 38%,transparent 28%,rgba(0,0,0,.82) 100%)}
  .tScrim.l{background:linear-gradient(95deg,rgba(0,0,0,.80) 0%,rgba(0,0,0,.36) 34%,transparent 60%)}
  .tScrim.b{background:linear-gradient(0deg,rgba(0,0,0,.68) 0%,transparent 44%)}
  #tDust{position:absolute;inset:0;pointer-events:none}
  #tShaft{position:absolute;top:-40%;left:35%;width:60%;height:190%;transform:rotate(16deg);
    pointer-events:none;mix-blend-mode:screen;filter:blur(26px);
    background:linear-gradient(90deg,transparent,rgba(201,162,39,.30) 42%,rgba(143,214,176,.12) 52%,transparent)}
  .tMark{position:absolute;top:26px;left:7%;display:flex;align-items:center;gap:9px;z-index:3;
    font-size:10px;letter-spacing:.35em;color:var(--dim)}
  .tMark i{width:16px;height:1px;background:var(--accent);display:block}
  .tBrand{position:absolute;top:11%;left:7%;right:7%}
  .tPlate{position:absolute;inset:-40px -90px -50px -70px;pointer-events:none;filter:blur(26px);
    background:radial-gradient(closest-side at 22% 50%,rgba(0,0,0,.5),rgba(0,0,0,.22) 55%,transparent 82%)}
  #title h1{position:relative;margin:0;font-family:"Noto Serif Thai",Georgia,serif;font-weight:600;
    font-size:clamp(34px,5.2vw,66px);line-height:.98;letter-spacing:4px;
    text-shadow:0 2px 6px rgba(0,0,0,.72),0 8px 44px rgba(0,0,0,.8);
    opacity:0;transform:translateY(14px);transition:1s cubic-bezier(.16,1,.3,1) .3s}
  #title p{position:relative;margin:14px 0 0;color:#ffffffc4;font-weight:300;text-transform:none;
    font-size:clamp(9px,.94vw,12px);letter-spacing:.42em;line-height:1.7;max-width:620px;
    text-shadow:0 2px 14px rgba(0,0,0,.8);
    opacity:0;transform:translateY(14px);transition:1s cubic-bezier(.16,1,.3,1) .42s}
  .tHair{position:relative;margin-top:34px;width:0;height:1px;background:var(--accent);
    box-shadow:0 0 10px var(--accent);transition:width 1.4s cubic-bezier(.16,1,.3,1) .85s}
  #title.ready h1,#title.ready p{opacity:1;transform:none}
  #title.ready .tHair{width:130px}
  #tNav{position:absolute;bottom:17%;left:7%;display:flex;flex-direction:column;align-items:flex-start;gap:7px}
  .titem{position:relative;background:none;border:0;cursor:pointer;padding:2px 0;text-align:left;
    font-family:"Noto Serif Thai",Georgia,serif;font-weight:300;color:#ffffffab;
    font-size:clamp(15px,1.9vw,24.5px);letter-spacing:2px;
    text-shadow:0 2px 5px rgba(0,0,0,.72),0 6px 26px rgba(0,0,0,.8);
    opacity:0;transform:translateX(-12px);
    transition:color .26s,transform .34s cubic-bezier(.16,1,.3,1),opacity .6s,letter-spacing .26s}
  .titem.in{opacity:1;transform:none}
  .titem::before{content:"";position:absolute;left:-20px;top:50%;width:0;height:1px;
    background:var(--accent);box-shadow:0 0 12px var(--accent);
    transition:width .3s cubic-bezier(.16,1,.3,1)}
  .titem:hover{color:#fff;transform:translateX(5px);letter-spacing:3px}
  .titem:hover::before{width:12px}

  #hint{position:absolute;right:12px;bottom:calc(58px + env(safe-area-inset-bottom));z-index:16}
  #dev{position:fixed;left:6px;bottom:6px;color:#0f0;font:11px monospace;z-index:99;display:none}
  @media (max-width:640px){
    #saytext{font-size:15px;line-height:1.8}
    .btn{padding:7px 10px;font-size:12px}
    #where{letter-spacing:.1em}
  }
  /* ================= สมุดคดี — แฟ้ม 3 มิติ ================= */
  #mCase{padding:0;background:rgba(2,4,7,.9)}
  .dwrap{position:absolute;inset:0;display:grid;grid-template-columns:minmax(250px,29%) 1fr;
    align-items:center;padding:0 5%;gap:10px}
  @media(max-width:900px){.dwrap{grid-template-columns:1fr;grid-template-rows:auto 1fr;padding:3vh 5%}}
  .dside{padding-right:26px}
  .dside h2{margin:0;font-family:"Noto Serif Thai",Georgia,serif;font-weight:500;
    font-size:clamp(22px,3vw,38px);letter-spacing:.06em;text-shadow:0 4px 30px #000}
  .dcap{margin-top:.6em;font-size:11px;letter-spacing:.4em;color:var(--dim)}
  .dhair{margin-top:1.1em;width:clamp(56px,8vw,105px);height:1px;background:var(--accent);
    box-shadow:0 0 10px var(--accent)}
  .dcount{margin-top:22px;font-size:12px;letter-spacing:.18em;color:var(--dim)}
  .dcount b{color:var(--accent);font-weight:500}
  .dinfo{margin-top:18px;min-height:180px}
  .dinfo .n{font-size:11px;letter-spacing:.32em;color:var(--accent);margin-bottom:7px}
  .dinfo h3{margin:0 0 10px;font-family:"Noto Serif Thai",Georgia,serif;font-weight:500;
    font-size:clamp(16px,1.9vw,23px)}
  .dinfo p{margin:0;font-size:clamp(12px,1vw,14px);color:var(--dim);line-height:1.95;max-width:400px}
  .dinfo .e{color:#ffffff52;font-size:12.5px;line-height:1.9;max-width:380px}
  .dhints{margin-top:26px;display:flex;flex-wrap:wrap;gap:9px 20px}
  .dhint{display:flex;align-items:center;gap:9px;font-size:11.5px;color:var(--dim)}
  .dhint b{font-weight:500;font-size:10px;letter-spacing:.1em;color:var(--ink);
    border:1px solid #ffffff26;padding:5px 9px;min-width:38px;text-align:center}
  .dcloseb{position:absolute;left:5%;bottom:6%;font-size:12.5px;letter-spacing:.18em;color:var(--dim);
    background:none;border:0;cursor:pointer;display:flex;align-items:center;gap:10px;z-index:8;font-family:inherit}
  .dcloseb:hover{color:var(--accent)}
  .dcloseb i{width:20px;height:1px;background:currentColor;transition:width .25s}
  .dcloseb:hover i{width:30px}

  .dstage{perspective:1900px;perspective-origin:52% 46%;display:flex;align-items:center;
    justify-content:center;height:100%}
  .dbook{position:relative;width:min(56vw,690px);aspect-ratio:1.42/1;transform-style:preserve-3d;cursor:grab;
    touch-action:none}
  .dbook.grab{cursor:grabbing}
  .dboard{position:absolute;top:0;height:100%;width:50%;transform-style:preserve-3d;
    background:linear-gradient(160deg,#c2a878,#a2895a);box-shadow:inset 0 0 60px #00000038}
  .dboard.l{left:0;opacity:0;transition:opacity .7s ease .35s;border-radius:8px 2px 2px 8px;
    transform:translateZ(-30px) rotateY(2.5deg);transform-origin:right center}
  .dboard.r{right:0;border-radius:2px 8px 8px 2px;
    transform:translateZ(-30px) rotateY(-2.5deg);transform-origin:left center}
  .dspine{opacity:0;transition:opacity .7s ease .35s;position:absolute;left:50%;top:-1%;height:102%;
    width:30px;transform:translateX(-50%) translateZ(-34px);pointer-events:none;
    background:linear-gradient(90deg,#00000000,#0000005e 42%,#0000005e 58%,#00000000)}
  .dbook.opened .dboard.l,.dbook.opened .dspine{opacity:1}

  #dSheets{position:absolute;inset:0;transform-style:preserve-3d}
  .dsheet{position:absolute;top:0;right:0;width:50%;height:100%;
    transform-origin:left center;transform-style:preserve-3d}
  .dpaper{position:absolute;inset:0;transform-origin:right center;transform-style:preserve-3d}
  .dface{position:absolute;inset:0;backface-visibility:hidden;transform-style:preserve-3d;
    background:linear-gradient(150deg,#f1e9d8,#e2d7be);
    box-shadow:inset 0 0 46px #6a5a3a2e,0 10px 26px #00000047}
  .dface.f{border-radius:2px 7px 7px 2px;
    background-image:linear-gradient(90deg,#00000024,transparent 7%),linear-gradient(150deg,#f1e9d8,#e2d7be)}
  .dface.b{transform:rotateY(180deg);border-radius:7px 2px 2px 7px;
    background-image:linear-gradient(270deg,#00000024,transparent 7%),linear-gradient(150deg,#f1e9d8,#e2d7be)}
  .dgloss{position:absolute;inset:0;pointer-events:none;opacity:0;border-radius:inherit;
    mix-blend-mode:overlay;z-index:9}

  .dcover{position:absolute;top:-1.5%;right:0;width:50.5%;height:103%;transform:translateZ(30px);
    transform-origin:left center;transform-style:preserve-3d;
    transition:transform 1.15s cubic-bezier(.55,.05,.25,1)}
  .dcover.open{transform:translateZ(-60px) rotateY(-176deg);pointer-events:none}
  .dcf{position:absolute;inset:0;backface-visibility:hidden}
  .dcf.f{border-radius:3px 10px 10px 3px;background:linear-gradient(155deg,#cdb27b,#967c4b);
    box-shadow:0 30px 70px #000000ad,inset 0 0 70px #00000030;
    display:flex;flex-direction:column;justify-content:center;padding:11% 12%}
  .dcf.b{transform:rotateY(180deg);border-radius:10px 3px 3px 10px;
    background:linear-gradient(155deg,#b19766,#856f44);box-shadow:inset 0 0 70px #00000042}
  .dlabel{position:relative;background:#f2ead6;padding:16px 20px;box-shadow:0 6px 18px #00000045;
    transform:rotate(-1.1deg);max-width:82%}
  .dlabel .t{font-family:"Noto Serif Thai",Georgia,serif;font-size:clamp(14px,1.6vw,21px);
    color:#23262c;font-weight:600;letter-spacing:.03em;line-height:1.35}
  .dlabel .s{white-space:nowrap;margin-top:7px;font-size:9.5px;letter-spacing:.3em;color:#6d6a60}
  .dstamp{position:absolute;right:9%;bottom:11%;border:3px solid #b6473c8c;color:#b6473cd6;
    font-family:"Noto Serif Thai",Georgia,serif;font-weight:600;font-size:clamp(10px,1.1vw,14px);
    padding:7px 14px;transform:rotate(-9deg);letter-spacing:.1em}
  .dhintopen{position:absolute;left:0;right:0;bottom:-42px;text-align:center;font-size:11.5px;
    letter-spacing:.22em;color:#ffffff8f;animation:dpuls 2.6s ease-in-out infinite}
  @keyframes dpuls{50%{opacity:.42}}

  .dpg{position:absolute;inset:0;padding:7.5% 8%;transform-style:preserve-3d}
  .dpg h5{margin:0;font-family:"Noto Serif Thai",Georgia,serif;font-size:clamp(10px,1.1vw,14px);
    color:#3a3a34;letter-spacing:.16em;border-bottom:1px solid #00000024;padding-bottom:7px;font-weight:500}
  .dslot{position:absolute;transform-style:preserve-3d;cursor:pointer;
    transform:translateZ(var(--z,5px)) rotate(var(--r,0deg));
    transition:transform .5s cubic-bezier(.16,1,.3,1)}
  .dslot::after{content:"";position:absolute;inset:3px;background:#20180c;opacity:.36;
    filter:blur(9px);border-radius:2px;transform:translateZ(-7px) translate(6px,10px);
    transition:transform .5s cubic-bezier(.16,1,.3,1),opacity .5s,filter .5s}
  .dslot:hover{transform:translateZ(30px) rotate(var(--r,0deg)) scale(1.02)}

  /* ================= หน้าโหลด (หลังกดเริ่มเกม) ================= */

  #mob{display:none}

    #hint{bottom:8px;right:8px;padding:6px 10px;font-size:11.5px}
    #hots .tip{font-size:10.5px;padding:3px 7px}

    #tMenu{gap:2px}
    .mpCard input{font-size:16px}
    .sheet,.paper{font-size:15.5px}
  }
  /* มือถือแนวนอน — จอเตี้ย บีบทุกอย่างให้พอดี */
  @media (orientation:landscape) and (max-height:520px){
    #frame{max-height:100vh}
    .btn{padding:6px 10px;font-size:12px}
    #say{padding:14px 5vw 15px}
    #saytext{font-size:15px;line-height:1.72}
    #bag{padding:7px 10px calc(7px + env(safe-area-inset-bottom))}
    .slot{padding:5px 10px;font-size:12px}
  }
  /* ---- แฟ้มคดีบนมือถือแนวตั้ง: แฟ้มอยู่บน ข้อความอยู่ล่าง เลื่อนอ่านได้ ---- */
  @media (orientation:portrait) and (max-width:820px){
    .dwrap{display:flex;flex-direction:column;align-items:stretch;gap:10px;
      padding:14px 16px calc(72px + env(safe-area-inset-bottom));overflow-y:auto}
    .dstage{order:1;flex:none;height:auto;padding:14px 0 46px;
      perspective:1500px;perspective-origin:50% 50%}
    .dbook{width:min(80vw,360px)}
    .dside{order:2;padding:0}
    .dside h2{font-size:22px}
    .dcount{margin-top:14px}
    .dinfo{min-height:0;margin-top:14px}
    .dinfo p,.dinfo .e{max-width:none}
    .dhints{margin-top:18px;gap:8px 16px}
    .dcloseb{left:16px;bottom:calc(16px + env(safe-area-inset-bottom))}
    .dlabel{padding:9px 11px;max-width:88%}
    .dlabel .t{font-size:12px;line-height:1.3}
    .dlabel .s{font-size:7px;letter-spacing:.16em;white-space:normal}
    .dstamp{font-size:9px;padding:4px 8px;border-width:2px}
    .dhintopen{bottom:-30px;font-size:10.5px;letter-spacing:.16em}
    .dnav{width:46px;height:46px}
    .ddoc,.dcardp{font-size:12.5px}
    .dcf.f{padding:9% 9%;overflow:hidden}
    /* ตอนแฟ้มยังปิด ปกอยู่ครึ่งขวาของกล่อง เลื่อนเข้ามาให้ดูอยู่กลางจอ */
    .dstage{transition:transform .9s cubic-bezier(.55,.05,.25,1)}
    .dstage:has(.dbook:not(.opened)){transform:translateX(-12%)}
  }
  @media (orientation:landscape) and (max-height:520px){
    .dbook{width:min(46vw,430px)}
    .dside h2{font-size:20px}
    .dinfo{min-height:0}
    .dhints{margin-top:12px}
  }

  /* ---------- เลือกโหมดยาก-ง่าย ---------- */
  .mdopt{display:block;width:100%;text-align:left;background:#0c1119;border:1px solid var(--line);
    border-radius:13px;padding:17px 19px;margin-bottom:11px;cursor:pointer;font-family:inherit;
    color:var(--ink);transition:.16s}
  .mdopt:hover{border-color:var(--accent);background:#101a24}

  .mdopt b{display:block;font-family:"Noto Serif Thai",Georgia,serif;font-weight:500;
    font-size:18px;margin-bottom:5px}
  .mdopt span{display:block;font-size:12.5px;color:var(--dim);line-height:1.75}
  @media (max-width:820px){.mdopt{padding:19px 17px}.mdopt b{font-size:17px}}
</style>
</head>

      en:"I turn them counter-clockwise.\n\nSlow. Heavy. Like turning something that has not wanted to move for thirty-nine years.\n\nThe bell rings twelve times.\nAnd stops.\n\nEvery light on campus comes up at once. Every lock lets go at once.\n\n—\n\nBy the time I reach the courtyard the sky is going pale.\nThe chain from the main doors is lying on the ground.\n\nI look back at the tower one last time.\nThe hands are moving. Correctly.\n\nAnd under the statue, where last night something was scratched — “it is a person” —\nthere is only smooth stone.\n\n—\n\nThe next day I go back up to the second floor.\n\nMy textbook is still open at the same page.\nThe pencil is still on the floor.\n\nThe 1987 notebook I put in my bag is not in my bag.\n\nIt is on the desk. Closed, neatly.\nAnd someone has added one line to the cover in pencil.\n\n“Thank you.”"} },

/* ===== engine ===== */

/* ============================ state ============================ */
const SAVE = "chime13.v1";
const fresh = () => ({ lang:"th", scene:"library", items:{}, ev:{}, notes:{}, flags:{}, conc:{},
                       scares:true, sound:true, ms:0, done:null });
let S = fresh(), started = 0, mem = null;

function save(){
  S.ms += performance.now() - started; started = performance.now();
  try{ localStorage.setItem(SAVE, JSON.stringify(S)); }catch(e){ mem = JSON.stringify(S); }
}
function load(){
  try{ const r = localStorage.getItem(SAVE) || mem; return r ? JSON.parse(r) : null; }
  catch(e){ return mem ? JSON.parse(mem) : null; }
}
function wipe(){ try{ localStorage.removeItem(SAVE); }catch(e){} mem = null; }

const L  = k => (STR[k] && (STR[k][S.lang] || STR[k].th)) || k;
const LT = o => !o ? "" : (o[S.lang] || o.th || "");

/* ============================ audio ============================ */
let AC = null, amb = null;
function actx(){
  if(AC) return AC;
  try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; }
  return AC;
}
function noise(dur){
  const c = actx(); if(!c) return null;
  const n = c.sampleRate * dur, b = c.createBuffer(1, n, c.sampleRate), d = b.getChannelData(0);
  for(let i=0;i<n;i++) d[i] = Math.random()*2-1;
  const s = c.createBufferSource(); s.buffer = b; return s;
}
function ambient(){
  const c = actx(); if(!c || amb) return;
  const g = c.createGain(); g.gain.value = 0; g.connect(c.destination);
  const f = c.createBiquadFilter(); f.type="lowpass"; f.frequency.value = 180; f.connect(g);
  [41.2, 41.9, 62.1].forEach(hz=>{
    const o = c.createOscillator(); o.type="sawtooth"; o.frequency.value = hz;
    const og = c.createGain(); og.gain.value = .28; o.connect(og); og.connect(f); o.start();
  });
  const w = noise(6); if(w){ w.loop = true; const wf = c.createBiquadFilter();
    wf.type="bandpass"; wf.frequency.value = 420; wf.Q.value = .7;
    const wg = c.createGain(); wg.gain.value = .05; w.connect(wf); wf.connect(wg); wg.connect(g); w.start(); }
  amb = g; g.gain.linearRampToValueAtTime(S.sound ? .16 : 0, c.currentTime + 3);
}
function sfx(kind){
  const c = actx(); if(!c || !S.sound) return;
  const t = c.currentTime, g = c.createGain(); g.connect(c.destination);
  if(kind==="click"){ const o=c.createOscillator(); o.type="triangle"; o.frequency.setValueAtTime(760,t);
    o.frequency.exponentialRampToValueAtTime(220,t+.07); g.gain.setValueAtTime(.05,t);
    g.gain.exponentialRampToValueAtTime(.0005,t+.09); o.connect(g); o.start(t); o.stop(t+.1); }
  if(kind==="step"){ const n=noise(.2); if(!n) return; const f=c.createBiquadFilter();
    f.type="lowpass"; f.frequency.value=520; g.gain.setValueAtTime(.10,t);
    g.gain.exponentialRampToValueAtTime(.0005,t+.2); n.connect(f); f.connect(g); n.start(t); n.stop(t+.22); }
  if(kind==="good"){ [523,659,784].forEach((hz,i)=>{ const o=c.createOscillator(); o.type="sine";
    o.frequency.value=hz; const gg=c.createGain(); gg.gain.setValueAtTime(0,t+i*.08);
    gg.gain.linearRampToValueAtTime(.07,t+i*.08+.02);
    gg.gain.exponentialRampToValueAtTime(.0005,t+i*.08+.5); o.connect(gg); gg.connect(c.destination);
    o.start(t+i*.08); o.stop(t+i*.08+.55); }); }
  if(kind==="bad"){ const o=c.createOscillator(); o.type="square"; o.frequency.setValueAtTime(150,t);
    o.frequency.exponentialRampToValueAtTime(70,t+.28); g.gain.setValueAtTime(.06,t);
    g.gain.exponentialRampToValueAtTime(.0005,t+.3); o.connect(g); o.start(t); o.stop(t+.32); }
  if(kind==="note"){ const o=c.createOscillator(); o.type="sine"; o.frequency.value=440;
    g.gain.setValueAtTime(.09,t); g.gain.exponentialRampToValueAtTime(.0005,t+.6);
    o.connect(g); o.start(t); o.stop(t+.62); }
  if(kind==="scare"){
    const n=noise(1.1); if(n){ const f=c.createBiquadFilter(); f.type="highpass"; f.frequency.value=900;
      g.gain.setValueAtTime(.5,t); g.gain.exponentialRampToValueAtTime(.0006,t+1.0);
      n.connect(f); f.connect(g); n.start(t); n.stop(t+1.1); }
    const o=c.createOscillator(); o.type="sawtooth"; o.frequency.setValueAtTime(1400,t);
    o.frequency.exponentialRampToValueAtTime(48,t+.9);
    const og=c.createGain(); og.gain.setValueAtTime(.34,t);
    og.gain.exponentialRampToValueAtTime(.0006,t+.95);
    o.connect(og); og.connect(c.destination); o.start(t); o.stop(t+1.0);
    for(let i=0;i<3;i++){ const b=c.createOscillator(); b.type="sine"; b.frequency.value=52;
      const bg=c.createGain(); bg.gain.setValueAtTime(0,t+1.1+i*.72);
      bg.gain.linearRampToValueAtTime(.2,t+1.16+i*.72);
      bg.gain.exponentialRampToValueAtTime(.0006,t+1.5+i*.72);
      b.connect(bg); bg.connect(c.destination); b.start(t+1.1+i*.72); b.stop(t+1.6+i*.72); } }
}
function noteTone(i){
  const c = actx(); if(!c || !S.sound) return;
  const hz = [0,392,440,494,523,587,659,740,784][i] || 440;
  const t = c.currentTime, o = c.createOscillator(), g = c.createGain();
  o.type = "triangle"; o.frequency.value = hz;
  g.gain.setValueAtTime(.13,t); g.gain.exponentialRampToValueAtTime(.0005,t+.75);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+.8);
}

/* ============================ dom ============================ */
const $ = id => document.getElementById(id);
const sceneImg=$("sceneimg"), hots=$("hots"), sayBox=$("say"), sayTxt=$("saytext"), sayMore=$("saymore");

function openM(id){ $(id).style.display="flex"; }
function closeM(id){ $(id).style.display="none"; }
document.querySelectorAll("[data-close]").forEach(b =>
  b.addEventListener("click", e => { e.target.closest(".mod").style.display="none"; sfx("click"); }));

function toast(text){
  const d = document.createElement("div"); d.className="tst"; d.textContent = text;
  $("toast").appendChild(d);
  setTimeout(()=>{ d.style.transition=".5s"; d.style.opacity="0"; setTimeout(()=>d.remove(),520); }, 2400);
}

/* ============================ conditions ============================ */
const allConc = () => Object.keys(CONCLUSIONS).every(k => S.conc[k]);
function ok(c){
  if(!c) return true;
  if(c.has    && !S.items[c.has])   return false;
  if(c.lacks  &&  S.items[c.lacks]) return false;
  if(c.flag   && !S.flags[c.flag])  return false;
  if(c.noflag &&  S.flags[c.noflag])return false;
  if(c.ready    && !allConc()) return false;
  if(c.notready &&  allConc()) return false;
  return true;
}

/* ============================ step runner ============================ */
let busy = false;
function waitSay(txt){
  return new Promise(res=>{
    sayTxt.textContent = LT(txt);
    sayMore.textContent = L("tapToContinue");
    sayBox.style.display = "block";
    const go = () => { sayBox.style.display="none"; sayBox.removeEventListener("click",go);
                       document.removeEventListener("keydown",kd); sfx("click"); res(); };
    const kd = e => { if(e.code==="Space"||e.code==="Enter"||e.code==="Escape"){ e.preventDefault(); go(); } };
    sayBox.addEventListener("click", go);
    document.addEventListener("keydown", kd);
  });
}
function waitModal(id){
  return new Promise(res=>{
    openM(id);
    const m = $(id);
    const iv = setInterval(()=>{ if(m.style.display==="none"){ clearInterval(iv); res(); } }, 120);
  });
}
function showNote(nid){
  const n = NOTES[nid]; if(!n) return Promise.resolve();
  S.notes[nid] = 1;
  $("noteBody").innerHTML = "<b>"+esc(LT(n.title))+"</b>"+esc(LT(n.body));
  sfx("note"); refreshHud();
  return waitModal("mNote");
}
function showCloseup(cid){
  $("cuImg").src = IMG[cid] || cid;
  $("cuImg").onerror = function(){ this.style.display="none"; };
  $("cuImg").style.display = "block";
  return waitModal("mCloseup");
}
function doScare(img){
  if(!S.scares) return Promise.resolve();
  return new Promise(res=>{
    const el = $("scare"), im = $("scareImg");
    im.src = IMG[img] || img;
    el.style.display = "block";
    $("flash").style.opacity = "1";
    setTimeout(()=>{ $("flash").style.transition=".22s"; $("flash").style.opacity="0"; }, 40);
    document.body.classList.add("shake");
    sfx("scare");
    setTimeout(()=>{ document.body.classList.remove("shake"); }, 500);
    setTimeout(()=>{ el.style.display="none"; $("flash").style.transition=""; res(); }, 1150);
  });
}
async function runCode(lockId){
  const lock = LOCKS[lockId];
  const okc = await showCode(lockId);
  if(okc){ S.flags["code_"+lockId] = 1; await run(lock.then || []); }
}
async function run(steps){
  if(!steps) return;
  for(const s of steps){
    if(s.if && !ok(s.if)) continue;
    if(s.once){ const k = "_once_"+s.once; if(S.flags[k]) continue; S.flags[k] = 1; }
    if(s.say)     await waitSay(s.say);
    if(s.closeup) await showCloseup(s.closeup);
    if(s.note)    await showNote(s.note);
    if(s.scare)   await doScare(s.scare);
    if(s.take)    give(s.take);
    if(s.ev)      giveEv(s.ev);
    if(s.set)     S.flags[s.set] = 1;
    if(s.code)    await runCode(s.code);
    if(s.puzzle)  await showRanat();
    if(s.goto)  { await goTo(s.goto); save(); return; }
    if(s.accuse)  await showAccuse();
    save();
  }
  refreshHud();
}
function give(id){ if(S.items[id]) return; S.items[id]=1;
  toast(L("gotItem")+" "+LT(ITEMS[id].name)); sfx("good"); refreshHud(); refreshBag(); }
function giveEv(id){ if(S.ev[id]) return; S.ev[id]=1;
  toast(L("gotEvidence")+" "+LT(EVIDENCE[id].name)); sfx("good"); refreshHud(); }

/* ============================ scene ============================ */
let reveal = false;
async function goTo(id){
  S.scene = id; sfx("step");
  const sc = SCENES[id];
  sceneImg.style.opacity = "0";
  await new Promise(r=>setTimeout(r,220));
  sceneImg.onerror = ()=>{ $("missing").style.display="flex";
    $("missing").querySelector("b").textContent = LT(sc.name);

const warmed = new Set();
function warm(key){

}
// Pull in whatever this room can lead to, so moving between rooms is instant.
function prefetch(sc){
  (sc.hotspots||[]).forEach(h=>(h.do||[]).forEach(st=>{
    if(st.goto && SCENES[st.goto]) warm(SCENES[st.goto].img);
    if(st.closeup) warm(st.closeup);
    if(st.scare)   warm(st.scare);
  }));

}

const dEase = t => t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
function dApply(sh,p){
  sh.p=p;
  const bow=Math.sin(Math.PI*p), lift=bow*26, wob=Math.sin(Math.PI*p*2)*1.1*(p>.5?1:.4);
  sh.el.style.transform='translateZ('+lift.toFixed(2)+'px) rotateY('+(-179.4*p).toFixed(2)+
    'deg) rotateZ('+wob.toFixed(2)+'deg)';
  sh.paper.style.transform='rotateY('+(-bow*13).toFixed(2)+'deg)';
  const x=(-15+130*p), a=(bow*.55).toFixed(3);
  sh.gloss.forEach(g=>{ g.style.opacity=bow?1:0;
    g.style.background='linear-gradient(102deg,rgba(0,0,0,'+(bow*.22).toFixed(3)+') '+(x-46)+
      '%,rgba(255,255,255,'+a+') '+x+'%,rgba(0,0,0,'+(bow*.16).toFixed(3)+') '+(x+44)+'%)'; });
}
function dZ(){ dSheetsA.forEach((sh,i)=> sh.el.style.zIndex = sh.p>.5 ? (i+1) : (dSheetsA.length-i+1)); }
function dNavUp(){
  const N=dSheetsA.length;
  $("dPrev").disabled = !dOpened||dBusy||dSpread===0;
  $("dNext").disabled = !dOpened||dBusy||dSpread===N;
  $("dPageNo").textContent = dOpened ? dT('sheetOf')+' '+Math.min(dSpread+1,N)+' / '+N : "";
}
function dFlip(i,to){
  const sh=dSheetsA[i], from=sh.p, t0=performance.now();
  dBusy=true; sh.el.style.zIndex=99;
  (function step(now){
    const t=Math.min(1,(now-t0)/1080);
    dApply(sh, from+(to-from)*dEase(t));
    if(t<1) requestAnimationFrame(step); else { dBusy=false; dZ(); dNavUp(); sfx("click"); }
  })(t0);
}
function dNext(){ const N=dSheetsA.length; if(!dOpened||dBusy||dSpread>=N)return; dFlip(dSpread,1); dSpread++; dNavUp(); }
function dPrev(){ if(!dOpened||dBusy||dSpread<=0)return; dSpread--; dFlip(dSpread,0); dNavUp(); }
function dGoPage(i){ const s=(i%2===0)? i/2 : (i+1)/2; while(dSpread<s){dSheetsA[dSpread]&&dApply(dSheetsA[dSpread],1);dSpread++;} dZ(); dNavUp(); }

function dInfoEmpty(){ $("dInfo").innerHTML = '<div class="e">'+dT('emptyInfo')+'</div>'; }
function dBuild(keepSpread){
  const pages=dPages(), N=Math.ceil(pages.length/2), box=$("dSheets");
  box.innerHTML="";
  for(let i=0;i<N;i++){
    const el=document.createElement("div"); el.className="dsheet";
    el.innerHTML='<div class="dpaper">'+
      '<div class="dface f"><div class="dpg">'+(pages[i*2]||"")+'</div><div class="dgloss"></div></div>'+
      '<div class="dface b"><div class="dpg">'+(pages[i*2+1]||"")+'</div><div class="dgloss"></div></div>'+
      '</div>';
    box.appendChild(el);
  }
  dSheetsA=[...box.children].map(el=>({el,paper:el.querySelector(".dpaper"),
    gloss:[...el.querySelectorAll(".dgloss")],p:0}));
  dBuildLeft(); dBuildRight();
  const keep = keepSpread ? Math.min(dSpread,N) : 0;
  dSpread=0; dSheetsA.forEach(sh=>dApply(sh,0));
  while(dSpread<keep){ dApply(dSheetsA[dSpread],1); dSpread++; }
  dZ(); dNavUp();
  $("dCount").innerHTML = L("evidence")+' <b>'+Object.keys(S.ev).length+'</b>/6 &nbsp;·&nbsp; '+
    L("conclusions")+' <b>'+Object.keys(S.conc).length+'</b>/3';
}

/* --- เปิดปก / หยิบของ / หมุนแฟ้ม --- */
let dDrag=false,dMoved=false,dRX=7,dRY=-16,dTX=7,dTY=-16,dSX=0,dSY=0,dBX=0,dBY=0,dT0=0;
function dStartLoop(){
  dLive=true; dT0=performance.now();
  const bk=$("dBook");
  (function loop(now){
    if(!dLive) return;
    const t=(now-dT0)/1000;
    if(!dDrag){ dTY+=(-16+Math.sin(t*.21)*1.7-dTY)*.04; dTX+=(7+Math.cos(t*.17)*1.1-dTX)*.04; }
    dRX+=(dTX-dRX)*.09; dRY+=(dTY-dRY)*.09;
    bk.style.transform='rotateX('+dRX.toFixed(2)+'deg) rotateY('+dRY.toFixed(2)+'deg)';
    dRAF=requestAnimationFrame(loop);
  })(performance.now());
}
(function wireDossier(){
  const bk=$("dBook");
  bk.addEventListener("pointerdown",e=>{ if(e.target.closest(".dnav"))return;
    dDrag=true;dMoved=false;bk.classList.add("grab");
    dSX=e.clientX;dSY=e.clientY;dBX=dRY;dBY=dRX; });
  addEventListener("pointermove",e=>{ if(!dDrag)return;
    if(Math.abs(e.clientX-dSX)+Math.abs(e.clientY-dSY)>5)dMoved=true;
    dTY=Math.max(-46,Math.min(14,dBX+(e.clientX-dSX)*.17));
    dTX=Math.max(-8,Math.min(26,dBY-(e.clientY-dSY)*.11)); });
  const rel=()=>{ dDrag=false;bk.classList.remove("grab");setTimeout(()=>dMoved=false,60); };
  addEventListener("pointerup",rel); addEventListener("pointercancel",rel);

  $("dCover").addEventListener("click",()=>{
    if(dMoved||dOpened)return;
    dOpened=true; sfx("click");
    $("dCover").classList.add("open"); bk.classList.add("opened");
    $("dHintOpen").style.display="none"; setTimeout(dNavUp,260);
  });
  $("dNext").addEventListener("click",e=>{e.stopPropagation();dNext()});
  $("dPrev").addEventListener("click",e=>{e.stopPropagation();dPrev()});
  $("dClose").addEventListener("click",dCloseCase);

  $("mCase").addEventListener("click",e=>{
    if(dMoved)return;
    const nt=e.target.closest("[data-note]");
    if(nt){ dCloseCase(); showNote(nt.dataset.note); return; }
    const ev=e.target.closest("[data-ev]");
    if(!ev) return;
    const k=ev.dataset.ev, i=pick.indexOf(k);
    if(i>=0) pick.splice(i,1); else { pick.push(k); if(pick.length>2) pick.shift(); }
    sfx("click");
    document.querySelectorAll("#mCase .dslot[data-ev]").forEach(n=>
      n.classList.toggle("sel", pick.includes(n.dataset.ev)));
    const e2=EVIDENCE[k];
    $("dInfo").innerHTML='<div class="n">'+dEVNO[k]+' / ๐๖</div><h3>'+esc(LT(e2.name))+
      '</h3><p>'+esc(LT(e2.desc))+'</p>';
    dTryLink();
  });
  addEventListener("keydown",e=>{
    if($("mCase").style.display!=="flex")return;
    if(e.key==="ArrowRight")dNext();
    if(e.key==="ArrowLeft")dPrev();
    if(e.key==="Escape")dCloseCase();
  });
})();

function showCode(lockId){
  const lock = LOCKS[lockId];
  return new Promise(res=>{
    let buf = "";
    $("codeT").textContent = L("lockedTitle");
    $("codeP").textContent = LT(lock.prompt) + "\n\n" + LT(lock.hint);
    $("codeMsg").textContent = "";
    const dial = $("dial"); const paint = ()=>{
      dial.innerHTML = "";
      for(let i=0;i<lock.digits;i++){ const s=document.createElement("span");
        s.textContent = buf[i] || "·"; dial.appendChild(s); }
    };
    const pad = $("pad"); pad.innerHTML = "";
    ["1","2","3","4","5","6","7","8","9","←","0","OK"].forEach(t=>{
      const btn = document.createElement("button"); btn.textContent = t;
      btn.addEventListener("click", ()=>{
        sfx("click");
        if(t==="←") buf = buf.slice(0,-1);
        else if(t==="OK"){
          if(buf === lock.answer){ $("codeMsg").textContent = L("codeRight"); sfx("good");
            setTimeout(()=>{ closeM("mCode"); res(true); }, 620); return; }
          $("codeMsg").textContent = L("codeWrong"); sfx("bad"); buf = "";
        }
        else if(buf.length < lock.digits) buf += t;
        paint();
      });
      pad.appendChild(btn);
    });
    paint(); openM("mCode");
    const iv = setInterval(()=>{ if($("mCode").style.display==="none"){ clearInterval(iv); res(buf===lock.answer); } },150);
  });
}

      mob.classList.toggle("talking", getComputedStyle($("say")).display !== "none");
    }).observe($("say"), {attributes:true, attributeFilter:["style"]});
  }catch(e){}

  /* จอสัมผัส — เปลี่ยนคำว่า "คลิก" เป็น "แตะ" ให้ตรงกับที่ผู้เล่นทำจริง */

  const size=()=>{ cv.width=innerWidth; cv.height=innerHeight;
    motes=Array.from({length:Math.round(innerWidth*innerHeight/32000)},()=>({
      x:Math.random()*cv.width,y:Math.random()*cv.height,r:.5+Math.random()*1.6,
      a:.05+Math.random()*.2,vy:-(.05+Math.random()*.15),ph:Math.random()*6.28,
      sw:.15+Math.random()*.5})); };
  size(); addEventListener("resize",()=>{ if($("title").style.display!=="none") size(); });
  const t0=performance.now();
  (function loop(now){
    if($("title").style.display!=="none"){
      const t=(now-t0)/1000, s7=.7, A=12;
      const dx=Math.sin(t*.083*s7)*A+Math.sin(t*.031*s7)*A*.55;
      const dy=Math.cos(t*.061*s7)*A*.65+Math.sin(t*.024*s7)*A*.4;
      wrap.style.transform="translate("+dx.toFixed(2)+"px,"+dy.toFixed(2)+"px) scale("+
        (1.06+Math.sin(t*.045*s7)*.008).toFixed(4)+")";
      $("tShaft").style.opacity=(.45*(.72+Math.sin(t*.19)*.28)).toFixed(3);
      cx.clearRect(0,0,cv.width,cv.height);
      for(const m of motes){
        m.y+=m.vy; m.x+=Math.sin(t*m.sw+m.ph)*.18;
        if(m.y<-6){ m.y=cv.height+6; m.x=Math.random()*cv.width; }
        cx.globalAlpha=m.a*(.55+Math.sin(t*1.4+m.ph)*.45);
        cx.fillStyle="#fff"; cx.beginPath(); cx.arc(m.x,m.y,m.r,0,6.2832); cx.fill();
      }
      cx.globalAlpha=1;
    }
    requestAnimationFrame(loop);
  })(performance.now());
})();

<script>
/* crisp-photo.js — ภาพนิ่งคมตรงพิกเซลจอ สำหรับเกมภาพถ่าย (point-and-click) · 16 ต.ค. 69
 *
 * ปัญหาที่วัดได้ (ฟิล์มม้วนสุดท้าย ฯลฯ): ภาพ 2752×1536 ถูกเบราว์เซอร์ย่อเองบนการ์ดจอ
 *   - ย่อแรง (หน้าต่างเล็ก/มือถือ/ภาพซูม) = แตกเป็นเม็ด-ขอบหยัก (ไม่มี mipmap)
 *   - วางเหลื่อมเศษพิกเซล (กรอบกลางจอ, ภาพซูมในกล่อง) = นุ่ม
 *   - createImageBitmap(resizeQuality) บน Chrome GPU ไม่สนค่า quality เลย (วัดแล้วเท่ากันทั้ง 3 ค่า)
 * วิธีแก้: ทับ <img> ด้วยผ้าใบที่ "พิกเซลเท่าจอเป๊ะ ชิดเส้นพิกเซล" แล้วย่อภาพเองด้วย Lanczos3 ใน worker
 *   (ไม่กินเฟรม · เกมไม่ต้องแก้อะไร · <img> เดิมยังเป็นตัวจริง ผ้าใบแค่ทับตอนพร้อม)
 *   worker ดึงภาพเองด้วย fetch (CDN ให้ CORS · โหลดซ้ำแค่ ~390 ไบต์จากแคช)
 *   ดึงไม่ได้ → ใช้ภาพที่ <img> โหลดแล้ว ย่อแบบ mipmap ในผ้าใบ (ยังดีกว่าเดิม)
 *   ไม่มี worker → ย่อ mipmap บนเธรดหลัก
 *
 * ใช้: วาง <script> ไฟล์นี้ก่อน </body> → จับ #sceneimg กับ #cuImg ให้เอง
 *      หรือ CrispPhoto.attach(imgElement) กับภาพอื่น
 * ปิดทดสอบ: ?crisp=0   ดูสถิติ: CrispPhoto.stats()
 * ภาพที่ยืดด้วย transform (title ลอยไปมา) ไม่ได้จัดการ — ใช้กับภาพที่นิ่งเท่านั้น
 */
(function () {
  "use strict";
  if (window.CrispPhoto) return;
  var OFF = /[?&]crisp=0\b/.test(location.search);
  var LOG = [];
  function log(o) { LOG.push(o); if (LOG.length > 40) LOG.shift(); }

  /* ---------------- worker: Lanczos3 ---------------- */
  var WORKER_SRC = function () {
    var cache = {};           // role -> {url, w, h, data(Uint8ClampedArray), alpha, bmp}
    function lanczos(x) {
      if (x === 0) return 1;
      if (x <= -3 || x >= 3) return 0;
      var px = Math.PI * x;
      return 3 * Math.sin(px) * Math.sin(px / 3) / (px * px);
    }
    // weights for mapping dst[0..n) <- src range [s0, s0+sl) of an axis with srcLen pixels
    function weights(n, s0, sl, srcLen) {
      var scale = sl / n, fs = Math.max(scale, 1), sup = 3 * fs;
      var start = new Int32Array(n), cnt = new Int32Array(n), maxc = Math.ceil(sup * 2) + 2;
      var w = new Float32Array(n * maxc);
      for (var i = 0; i < n; i++) {
        var c = s0 + (i + 0.5) * scale - 0.5;
        var a = Math.floor(c - sup) + 1, b = Math.floor(c + sup), k = 0, sum = 0;
        if (b - a + 1 > maxc) b = a + maxc - 1;
        start[i] = a;

  var worker = null, seq = 0, pending = {};

  /* ---------------- per-image overlay ---------------- */
  function pct(v, free) {   // object-position component -> fraction of free space
    v = String(v || "50%").trim();
    if (v === "left" || v === "top") return 0;
    if (v === "right" || v === "bottom") return 1;
    if (v === "center") return 0.5;
    if (/%$/.test(v)) return parseFloat(v) / 100;
    var px = parseFloat(v); return free ? (isFinite(px) ? px / free : 0.5) : 0.5;
  }

  function attach(img, role) {
    if (!img || img.__crisp || OFF) return;
    role = role || img.id || "img";
    var cv = document.createElement("canvas");
    cv.className = "crisp-photo";
    cv.setAttribute("aria-hidden", "true");
    cv.style.cssText = "position:absolute;left:0;top:0;transform-origin:0 0;image-rendering:pixelated;pointer-events:none;visibility:hidden;margin:0;padding:0;border:0;max-width:none;max-height:none";
    img.insertAdjacentElement("afterend", cv);
    var par = img.parentElement;
    if (getComputedStyle(par).position === "static") par.style.position = "relative";
    var st = { shown: false, key: "", job: 0, timer: 0, ignore: 0 };
    img.__crisp = st;

    function mirror() {
      var cs = getComputedStyle(img);
      cv.style.opacity = img.style.opacity !== "" ? img.style.opacity : cs.opacity;
      cv.style.transition = cs.transition;
      cv.style.filter = cs.filter === "none" ? "" : cs.filter;
      cv.style.borderRadius = cs.borderRadius;
    }
    function hide() {
      if (!st.shown) return;
      st.shown = false; cv.style.visibility = "hidden";

    }
    function show() {
      st.shown = true; mirror(); cv.style.visibility = "visible";

    }

      var d = window.devicePixelRatio || 1;
      // content box (inside border+padding)
      var bl = parseFloat(cs.borderLeftWidth) + parseFloat(cs.paddingLeft), bt = parseFloat(cs.borderTopWidth) + parseFloat(cs.paddingTop);
      var br = parseFloat(cs.borderRightWidth) + parseFloat(cs.paddingRight), bb = parseFloat(cs.borderBottomWidth) + parseFloat(cs.paddingBottom);
      var bx = r.left + bl, by = r.top + bt, bw = r.width - bl - br, bh = r.height - bt - bb;
      var nw = img.naturalWidth, nh = img.naturalHeight, fit = cs.objectFit || "fill";
      var pcs = getComputedStyle(par), clips = fit === "cover" && pcs.overflow !== "visible" &&
